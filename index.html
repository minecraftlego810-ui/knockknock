<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>똑똑 KnockKnock · 타격음 진공 열화 판정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* 정상·열화 색 = 보고서 그래프 색. 작은 글씨용 열화색은 대비를 위해 같은 계열의 진한 색 */
  :root { --ink:#1f2328; --mute:#6a737d; --faint:#a8b0b9; --line:#e3e6ea; --bg:#f5f6f7;
          --norm:#2f4b7c; --deg:#3aa38f; --degt:#24806f; --err:#c5392f; --amber:#a86a00; --track:#eef0f2; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","맑은 고딕",sans-serif; font-weight:400;
    -webkit-font-smoothing:antialiased; }
  body { display:grid; grid-template-rows:auto 1fr auto; height:100vh; padding:0 2.6vw; }
  .num { font-variant-numeric:tabular-nums; }
  header { display:flex; align-items:center; justify-content:space-between; padding:2.6vh 0 2.2vh; }
  header h1 { margin:0; font-size:2.6vh; font-weight:700; letter-spacing:-0.01em; }
  header h1 span { font-weight:400; color:var(--mute); margin-left:1.1em; font-size:2.1vh; }
  .badge { font-size:1.8vh; color:var(--mute); white-space:nowrap; }
  .badge::before { content:""; display:inline-block; width:1vh; height:1vh; border-radius:50%;
                   background:var(--faint); margin-right:0.5vw; vertical-align:0.15vh; }
  .badge.on::before { background:#2e9e5b; } .badge.on { color:var(--ink); }
  .badge.off::before { background:var(--err); } .badge.off { color:var(--err); }

  main { display:grid; grid-template-columns:1fr 0.92fr 1.12fr; gap:2.8vw; min-height:0; padding-bottom:2vh; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:8px;
           display:flex; flex-direction:column; min-height:0; position:relative; }
  .panel + .panel::before { content:""; position:absolute; left:calc(-2.8vw - 1px); width:2.8vw; top:50%; border-top:1px solid #c9ced4; }
  .ph { padding:2vh 1.5vw 0; display:flex; align-items:baseline; gap:0.7vw; }
  .ph .k { font-size:1.6vh; color:var(--faint); font-weight:500; }
  .ph .t { font-size:2.2vh; font-weight:500; }
  .pb { padding:1.6vh 1.5vw 2vh; display:flex; flex-direction:column; min-height:0; flex:1 1 auto; }
  .note { font-size:1.5vh; color:var(--mute); line-height:1.55; }

  svg { display:block; width:100%; }
  #spec { flex:1 1 auto; min-height:0; }
  .legend { display:flex; flex-direction:column; gap:0.4vh; font-size:1.6vh; color:#444c55; margin-top:1vh; }
  .legend i { display:inline-block; width:2vw; border-top:2.5px solid; vertical-align:middle; margin-right:0.5vw; }

  #hits { margin-top:2.2vh; }
  .hit { display:grid; grid-template-columns:4.2vw 1fr auto; align-items:baseline; padding:1.4vh 0; border-top:1px solid var(--line); }
  .hit:last-child { border-bottom:1px solid var(--line); }
  .hit .i { font-size:1.7vh; color:var(--mute); }
  .hit .f { font-size:3.1vh; font-weight:500; color:#c9ced4; letter-spacing:-0.01em; }
  .hit .f small { font-size:1.6vh; font-weight:400; margin-left:0.3em; color:var(--mute); }
  .hit.on .f { color:var(--ink); }
  .hit .l { font-size:1.9vh; font-weight:500; color:var(--mute); }
  .hit .l::before { content:""; display:inline-block; width:1vh; height:1vh; border-radius:50%; margin-right:0.5vw;
                    background:transparent; vertical-align:0.15vh; }
  .hit.g .l::before { background:var(--faint); }
  .hit.n .l { color:var(--norm); } .hit.n .l::before { background:var(--norm); }
  .hit.d .l { color:var(--degt); } .hit.d .l::before { background:var(--deg); }
  #hist { font-size:1.7vh; color:var(--err); min-height:2.4vh; margin-top:1vh; }

  #big { font-size:12.5vh; font-weight:500; line-height:1.1; letter-spacing:-0.045em; color:#c9ced4; margin-top:1.2vh; }
  #big2 { font-size:3.2vh; font-weight:400; min-height:4.2vh; color:var(--mute); margin-top:0.4vh; letter-spacing:-0.01em; }
  #sub { font-size:1.95vh; color:#444c55; margin-top:1.2vh; min-height:2.8vh; }

  .votes { margin-top:auto; }
  .votes .cap { font-size:1.55vh; color:var(--mute); margin-bottom:1.2vh; }
  .vrow { display:grid; grid-template-columns:4.2vw 1fr 6.2vw; align-items:center; gap:0.8vw; margin-bottom:1.1vh; }
  .vrow b { font-size:2.1vh; font-weight:500; }
  .vrow.n b { color:var(--norm); } .vrow.d b { color:var(--degt); }
  .track { height:2.6vh; background:var(--track); border-radius:99px; overflow:hidden; position:relative; }
  .fill { height:100%; width:0; border-radius:99px; transition:width .5s ease; }
  .vrow.n .fill { background:var(--norm); } .vrow.d .fill { background:var(--deg); }
  .val { font-size:2.1vh; font-weight:500; text-align:right; color:var(--ink); white-space:nowrap; }
  .val small { color:var(--mute); font-weight:400; font-size:1.6vh; margin-left:0.3em; }
  .val.mute { color:var(--faint); font-size:1.6vh; font-weight:400; }

  .ctrl { display:flex; gap:0.6vw; margin-top:1.8vh; padding-top:1.8vh; border-top:1px solid var(--line); }
  .ctrl button { font-family:inherit; font-size:2vh; font-weight:500; padding:1.2vh 1.2vw; border-radius:6px;
    border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; flex:1; }
  .ctrl button.end { background:#fff; color:var(--ink); border-color:#c9ced4; }
  .ctrl button#bHome { color:var(--mute); flex:0.8; }
  .ctrl button:disabled { border-color:var(--track); background:var(--track); color:var(--faint); cursor:default; }
  .ctrl button.wait { opacity:0.55; }

  footer { display:flex; justify-content:space-between; font-size:1.45vh; color:var(--faint); padding:0 0 1.6vh; }
</style>
</head>
<body>
<header>
  <h1>똑똑 KnockKnock<span>타격음으로 이중벽 텀블러의 진공 열화를 판정합니다</span></h1>
  <div id="conn" class="badge">연결 확인 중</div>
</header>

<main>
  <section class="panel">
    <div class="ph"><span class="k">01</span><span class="t">타격음 스펙트럼</span></div>
    <div class="pb">
      <svg id="spec" viewBox="0 0 600 690" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i style="border-color:var(--norm);border-top-style:dashed"></i>정상 평균 (학습)</span>
        <span><i style="border-color:var(--deg);border-top-style:dashed"></i>열화 평균 (학습)</span>
        <span><i style="border-color:var(--ink)"></i>방금 친 소리</span>
      </div>
      <div class="note" style="margin-top:0.8vh">가로: 주파수(Hz) · 세로: 세기(dB, 최댓값 = 0)</div>
    </div>
  </section>

  <section class="panel">
    <div class="ph"><span class="k">02</span><span class="t">주 공진 주파수</span></div>
    <div class="pb">
      <svg id="bar" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="note">띠 = 학습 녹음별 평균의 범위 (Hz)<br>판정은 이 값을 포함한 특징으로 분류기가 내림</div>
      <div id="hits" class="num"></div>
      <div id="hist"></div>
    </div>
  </section>

  <section class="panel">
    <div class="ph"><span class="k">03</span><span class="t">판정 결과</span></div>
    <div class="pb">
      <div id="big">대기 중</div>
      <div id="big2"></div>
      <div id="sub">시연 노트북에서 판정 프로그램을 시작하면 결과가 여기에 표시됩니다</div>
      <div class="votes num">
        <div class="cap" id="vcap">유효 타격 <span id="nv">3</span>회 다수결 · 득표율</div>
        <div class="vrow n"><b>정상</b><div class="track"><div class="fill" id="vn"></div></div><span class="val" id="vz0"></span></div>
        <div class="vrow d"><b>열화</b><div class="track"><div class="fill" id="vd"></div></div><span class="val" id="vz1"></span></div>
      </div>
      <div class="ctrl">
        <button id="bStart" onclick="sendCmd('start')">검사 시작</button>
        <button id="bEnd" class="end" onclick="sendCmd('end')">검사 종료</button>
        <button id="bHome" class="end" onclick="sendCmd('reset')">처음 화면</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <span>판정은 시연 노트북에서 계산되어 실시간으로 전송됩니다</span>
  <span id="sess"></span>
</footer>

<script>
/* ---------- 설정 (주소 뒤에 ?s=세션이름 으로 바꿀 수 있음) ---------- */
const P = new URLSearchParams(location.search);
const SUPABASE_URL = P.get("url") || "https://xuwzdqvusjgwrxflztrv.supabase.co";
const ANON_KEY = P.get("key") || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1d3pkcXZ1c2pnd3J4Zmx6dHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMDczOTEsImV4cCI6MjExMDU4MzM5MX0.ZHwTN6z17DK2TaUMcJ25hUyvBwYvGa1IEWhKMR7gohc";
const SESSION = P.get("s") || "knock";
const POLL_MS = 400;

const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const $ = id => document.getElementById(id);
const BLUE = "#2f4b7c", RED = "#3aa38f", GRAY = "#8a8f98";  /* BLUE = 정상, RED = 열화 (보고서 그래프 색) */
$("sess").textContent = "세션: " + SESSION;

let cfg = null;          // start 이벤트 내용 (기준 스펙트럼, 범위, 다수결 수)
let round = [];          // 이번 판정의 유효 타격
let finalDone = false;
let lastId = 0;
let lastStatusStamp = null, lastStatusSeen = 0;
let fetchOk = true;

/* ---------- 그리기 ---------- */
const PL = 44, PR = 22, PT = 10;
function specPath(arr, grid, w, h) {
  if (!arr) return "";
  const [f0, f1, n] = grid;
  return arr.map((v, i) => {
    const x = PL + (i / (n - 1)) * (w - PL - PR);
    const y = PT + Math.min(h, Math.max(0, (-v / 40) * h));
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
}
function drawSpec(cur) {
  const W = 600, Hh = 640, svg = $("spec");
  const grid = cfg ? cfg.grid : [3400, 4600, 241];
  let s = "";
  for (let db = 0; db <= 40; db += 10) {
    const y = PT + db / 40 * Hh;
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="${db === 40 ? "#9aa0a6" : "#eceff1"}"/>`;
    s += `<text x="${PL - 8}" y="${y + 5}" font-size="15" fill="#6a737d" text-anchor="end">${-db}</text>`;
  }
  for (let f = 3400; f <= 4600; f += 400) {
    const x = PL + (f - grid[0]) / (grid[1] - grid[0]) * (W - PL - PR);
    s += `<line x1="${x}" x2="${x}" y1="${PT}" y2="${PT + Hh}" stroke="#eceff1"/>`;
    s += `<text x="${x}" y="${PT + Hh + 26}" font-size="16" fill="#6a737d" text-anchor="middle">${f.toLocaleString()}</text>`;
  }
  if (cfg && cfg.ref) {
    if (cfg.ref["정상"]) s += `<path d="${specPath(cfg.ref["정상"], grid, W, Hh)}" fill="none" stroke="${BLUE}" stroke-width="2.2" stroke-dasharray="7 5"/>`;
    if (cfg.ref["열화"]) s += `<path d="${specPath(cfg.ref["열화"], grid, W, Hh)}" fill="none" stroke="${RED}" stroke-width="2.2" stroke-dasharray="7 5"/>`;
  }
  if (cur) s += `<path d="${specPath(cur, grid, W, Hh)}" fill="none" stroke="#1f2328" stroke-width="2.8"/>`;
  svg.innerHTML = s;
}
function drawBar() {
  const W = 600, svg = $("bar"), Y0 = 40, Y1 = 128;
  if (!cfg || !cfg.ranges) { svg.innerHTML = ""; return; }
  const r = cfg.ranges.f_main, n = r["정상"], d = r["열화"];
  const lo = Math.min(n[0], d[0]), hi = Math.max(n[1], d[1]);
  const pad = 0.3 * (hi - lo), x0 = lo - pad, x1 = hi + pad;
  const X = f => 8 + (f - x0) / (x1 - x0) * (W - 16);
  let s = "";
  s += `<rect x="${X(n[0])}" y="${Y0}" width="${Math.max(4, X(n[1]) - X(n[0]))}" height="${Y1 - Y0}" rx="4" fill="${BLUE}" opacity="0.2"/>`;
  s += `<rect x="${X(d[0])}" y="${Y0}" width="${Math.max(4, X(d[1]) - X(d[0]))}" height="${Y1 - Y0}" rx="4" fill="${RED}" opacity="0.18"/>`;
  s += `<text x="${X((n[0]+n[1])/2)}" y="${Y0 - 12}" font-size="19" font-weight="500" fill="${BLUE}" text-anchor="middle">정상</text>`;
  s += `<text x="${X((d[0]+d[1])/2)}" y="${Y0 - 12}" font-size="19" font-weight="500" fill="#24806f" text-anchor="middle">열화</text>`;
  const span = x1 - x0, step = span > 1200 ? 200 : span > 300 ? 100 : 50;
  for (let f = Math.ceil(x0 / step) * step; f <= x1; f += step) {
    if (X(f) < 36 || X(f) > W - 36) continue;
    s += `<line x1="${X(f)}" x2="${X(f)}" y1="${Y1}" y2="${Y1 + 10}" stroke="#9aa3ad" stroke-width="1.5"/>`;
    s += `<text x="${X(f)}" y="${Y1 + 34}" font-size="17" fill="#6a737d" text-anchor="middle">${f.toLocaleString()}</text>`;
  }
  s += `<line x1="8" x2="${W - 8}" y1="${Y1}" y2="${Y1}" stroke="#9aa3ad" stroke-width="1.5"/>`;
  round.forEach((h, i) => {
    const x = Math.max(10, Math.min(W - 10, X(h.f_main)));
    const c = finalDone ? (h.pred ? RED : BLUE) : "#1f2328";
    s += `<line x1="${x}" x2="${x}" y1="${Y0 + 24}" y2="${Y1}" stroke="${c}" stroke-width="2.5"/>`;
    s += `<circle cx="${x}" cy="${Y0 + 12}" r="10" fill="${c}"/>`;
    s += `<text x="${x}" y="${Y0 + 18}" font-size="13" font-weight="500" fill="#fff" text-anchor="middle">${i + 1}</text>`;
  });
  svg.innerHTML = s;
}
function drawDots() {
  const N = cfg ? cfg.votes : 3;
  let s = "";
  for (let i = 0; i < N; i++) {
    const h = round[i];
    const cls = h ? "on " + (finalDone ? (h.pred ? "d" : "n") : "g") : "";
    const f = h ? Math.round(h.f_main).toLocaleString() : "—";
    const l = h ? (finalDone ? h.label : "완료") : "";
    s += `<div class="hit ${cls}"><span class="i">${i + 1}회</span>` +
         `<span class="f">${f}<small>${h ? "Hz" : ""}</small></span><span class="l">${l}</span></div>`;
  }
  $("hits").innerHTML = s;
  drawVotes();
}
/* 출력 막대 = 유효 타격 중 정상/열화 표의 비율 (판정 규칙인 다수결과 같은 값). 검사 중에는 가림 */
function drawVotes() {
  const n = round.length, k = round.filter(h => h.pred).length;
  const show = finalDone && n > 0;
  const pn = show ? Math.round(100 * (n - k) / n) : 0, pd = show ? Math.round(100 * k / n) : 0;
  $("vn").style.width = pn + "%"; $("vd").style.width = pd + "%";
  const lab = (p, c) => show ? `${p}%<small>${c}/${n}</small>` : (n ? "검사 후 공개" : "");
  $("vz0").innerHTML = lab(pn, n - k); $("vz1").innerHTML = lab(pd, k);
  $("vz0").classList.toggle("mute", !show); $("vz1").classList.toggle("mute", !show);
}
function drawHist(extra) { $("hist").textContent = extra || ""; }
function setBig(text, color, sub) {
  const m = /^(.*?)\s*\((.*)\)$/.exec(text);
  $("big").textContent = m ? m[1] : text;
  $("big2").textContent = m ? m[2] : "";
  $("big").style.color = color === GRAY ? "#c9ced4" : color;
  $("big2").style.color = color === GRAY ? "#6a737d" : (color === RED ? "#24806f" : color);
  $("sub").textContent = sub || "";
}
function clearRound() { round = []; finalDone = false; drawBar(); drawDots(); drawHist(); }

/* ---------- 이벤트 처리 (노트북 판정 창과 같은 상태를 따라감) ---------- */
const AMBER = "#a86a00", INK = "#1f2328";
let testing = false;
function votesN() { return cfg ? cfg.votes : 3; }
function handle(ev) {
  handle2(ev);
  if (ev.kind === "test_start") { judging = false; if (waitCmd === "start") waitCmd = null; }
  if (ev.kind === "test_end") { judging = true; if (waitCmd === "end") waitCmd = null; }
  if (ev.kind === "final" || ev.kind === "start" || ev.kind === "reset") judging = false;
  if (ev.kind === "reset") { testing = false; if (waitCmd === "reset") waitCmd = null; }
  if (ev.kind === "cancel") { judging = false; if (waitCmd === "end") waitCmd = null; }
  updateButtons();
}
function handle2(ev) {
  const p = ev.payload || {};
  if (ev.kind === "start") {
    cfg = p; clearRound(); drawSpec(null); $("nv").textContent = p.votes || 3; testing = false;
    setBig("대기 중", GRAY, "검사 시작을 기다리는 중입니다");
  } else if (ev.kind === "test_start") {
    if (cfg && p.votes) cfg.votes = p.votes;
    clearRound(); drawSpec(null); testing = true;
    setBig(`검사 중 (0/${votesN()})`, INK, "텀블러를 쳐 주세요");
  } else if (ev.kind === "invalid") {
    if (p.spec) drawSpec(p.spec);
    setBig(`검사 중 (${round.length}/${votesN()})`, INK, "다시 쳐 주세요: " + (p.reason || ""));
    drawHist("(무효: " + (p.reason || "") + ")");
  } else if (ev.kind === "hit") {
    round.push(p);
    if (p.spec) drawSpec(p.spec);
    setBig(`검사 중 (${round.length}/${votesN()})`, INK,
           `${round.length}회째 타격 완료 · 주 공진 주파수 ${Math.round(p.f_main).toLocaleString()} Hz`);
    drawBar(); drawDots(); drawHist();
  } else if (ev.kind === "test_end") {
    testing = false;
    setBig("판정 중...", INK, `유효 타격 ${round.length}회 분석 중`);
  } else if (ev.kind === "final") {
    finalDone = true; testing = false;
    if (p.final === null || p.final === undefined) {
      setBig("판정 보류", AMBER, `${p.n}회 중 ${p.k}회 열화로 결과가 엇갈림 · 다시 검사해 주세요`);
    } else {
      setBig(p.final ? "열화 (진공 손상)" : "정상 (진공 유지)", p.final ? RED : BLUE,
             `판정 완료: ${p.n}회 중 ${p.k}회 열화 · 평균 ${Math.round(p.f_mean).toLocaleString()} Hz`);
    }
    drawBar(); drawDots(); drawHist();
  } else if (ev.kind === "cancel") {
    clearRound(); testing = false;
    setBig("검사 취소", GRAY, "유효 타격이 없어 판정하지 않았습니다");
  } else if (ev.kind === "reset") {
    clearRound(); drawSpec(null); testing = false; setBig("대기 중", GRAY, "검사 시작을 기다리는 중입니다");
  }
}

/* ---------- 버튼 (명령은 인터넷을 거쳐 시연 노트북으로 전달) ---------- */
let judging = false, linked = false, waitCmd = null;
function updateButtons() {
  const bs = $("bStart"), be = $("bEnd"), bh = $("bHome");
  bh.disabled = !linked || waitCmd !== null;
  bh.classList.toggle("wait", waitCmd === "reset");
  bh.textContent = waitCmd === "reset" ? "돌아가는 중..." : "처음 화면";
  bs.disabled = !linked || testing || judging || waitCmd !== null;
  be.disabled = !linked || !testing || waitCmd !== null;
  bs.classList.toggle("wait", waitCmd === "start"); be.classList.toggle("wait", waitCmd === "end");
  bs.textContent = waitCmd === "start" ? "시작하는 중..." : "검사 시작";
  be.textContent = waitCmd === "end" ? "종료하는 중..." : "검사 종료";
}
async function sendCmd(cmd) {
  if (waitCmd) return;
  waitCmd = cmd; updateButtons();
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/demo_commands", { method: "POST",
      headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=minimal" }, H),
      body: JSON.stringify({ session: SESSION, cmd: cmd }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (e) { waitCmd = null; updateButtons(); return; }
  setTimeout(() => { if (waitCmd === cmd) { waitCmd = null; updateButtons(); } }, 4000);
}

/* ---------- 서버에서 가져오기 ---------- */
async function get(path) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: H, cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function init() {
  try {
    const st = await get(`demo_events?select=id&session=eq.${encodeURIComponent(SESSION)}&kind=eq.start&order=id.desc&limit=1`);
    lastId = st.length ? st[0].id - 1 : 0;
  } catch (e) { fetchOk = false; }
  drawSpec(null); drawDots();
  poll(); status();
}
async function poll() {
  try {
    const evs = await get(`demo_events?select=id,kind,payload&session=eq.${encodeURIComponent(SESSION)}&id=gt.${lastId}&order=id.asc&limit=50`);
    evs.forEach(ev => { handle(ev); lastId = ev.id; });
    fetchOk = true;
  } catch (e) { fetchOk = false; }
  setTimeout(poll, POLL_MS);
}
async function status() {
  try {
    const st = await get(`demo_status?select=updated_at,payload&session=eq.${encodeURIComponent(SESSION)}`);
    if (st.length && st[0].updated_at !== lastStatusStamp) { lastStatusStamp = st[0].updated_at; lastStatusSeen = Date.now(); }
    fetchOk = true;
  } catch (e) { fetchOk = false; }
  const c = $("conn");
  linked = fetchOk && (Date.now() - lastStatusSeen < 8000); updateButtons();
  if (!fetchOk) { c.textContent = "인터넷 연결 안 됨"; c.className = "badge off"; }
  else if (Date.now() - lastStatusSeen < 8000) { c.textContent = "시연 노트북 연결됨"; c.className = "badge on"; }
  else { c.textContent = "시연 노트북 신호 없음"; c.className = "badge off"; }
  setTimeout(status, 2000);
}
init();
</script>
