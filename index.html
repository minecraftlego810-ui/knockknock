<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>똑똑 KnockKnock · 타격음 진공 열화 판정</title>
<style>
  :root { --blue:#1f5fa8; --red:#c0392b; --gray:#8a8f98; --ink:#1b1f24; --line:#d9dde3; --bg:#ffffff; --soft:#f4f6f9; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif; }
  body { display:flex; flex-direction:column; padding:2.2vh 2.6vw; gap:1.6vh; }
  header { display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:2.6vh; font-weight:700; letter-spacing:-0.02em; }
  header h1 span { color:var(--gray); font-weight:400; margin-left:0.8em; }
  .badge { font-size:1.8vh; padding:0.5vh 1.1vw; border-radius:99px; background:var(--soft); color:var(--gray); white-space:nowrap; }
  .badge.on { background:#e7f4ea; color:#24723a; }
  .badge.off { background:#fbeaea; color:var(--red); }
  .verdict { flex:0 0 auto; text-align:center; padding:2.2vh 0 1.4vh; border:1px solid var(--line); border-radius:14px; }
  #big { font-size:11vh; font-weight:800; line-height:1.1; letter-spacing:-0.03em; color:var(--gray); }
  #sub { font-size:2.6vh; margin-top:1vh; color:#444; min-height:3.2vh; }
  .dots { display:flex; justify-content:center; gap:1.2vw; margin-top:1.4vh; }
  .dot { width:2.6vh; height:2.6vh; border-radius:50%; border:2px solid var(--line); }
  .dot.n { background:var(--blue); border-color:var(--blue); } .dot.d { background:var(--red); border-color:var(--red); }
  .dot.g { background:#555; border-color:#555; }
  .row { flex:1 1 auto; display:grid; grid-template-columns: 1.35fr 1fr; gap:1.6vw; min-height:0; }
  .card { border:1px solid var(--line); border-radius:14px; padding:1.4vh 1.2vw; display:flex; flex-direction:column; min-height:0; }
  .card h2 { margin:0 0 0.8vh; font-size:2vh; font-weight:700; color:#333; }
  .card h2 small { font-weight:400; color:var(--gray); margin-left:0.5em; }
  svg { width:100%; flex:1 1 auto; min-height:0; }
  .legend { display:flex; gap:1.4vw; font-size:1.6vh; color:#444; margin-top:0.6vh; flex-wrap:wrap; }
  .legend i { display:inline-block; width:2.2vw; height:0; border-top:3px solid; vertical-align:middle; margin-right:0.4vw; }
  #hist { list-style:none; margin:0.8vh 0 0; padding:0; font-size:2.1vh; line-height:1.7; }
  #hist li b.n { color:var(--blue); } #hist li b.d { color:var(--red); } #hist li.x { color:var(--gray); }
  footer { font-size:1.5vh; color:var(--gray); display:flex; justify-content:space-between; }
</style>
</head>
<body>
<header>
  <h1>똑똑 KnockKnock<span>타격음으로 진공 이중벽 텀블러의 진공 열화 판정</span></h1>
  <div id="conn" class="badge">연결 확인 중</div>
</header>

<section class="verdict">
  <div id="big">대기 중</div>
  <div id="sub">시연 노트북에서 판정 프로그램을 시작하면 결과가 여기에 표시됩니다</div>
  <div class="dots" id="dots"></div>
</section>

<section class="row">
  <div class="card">
    <h2>타격음 스펙트럼<small>가로: 주파수(Hz), 세로: 세기(dB, 가장 센 값 = 0)</small></h2>
    <svg id="spec" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend">
      <span><i style="border-color:var(--blue);border-top-style:dashed"></i>정상 평균 (학습)</span>
      <span><i style="border-color:var(--red);border-top-style:dashed"></i>열화 평균 (학습)</span>
      <span><i style="border-color:#111"></i>방금 친 소리</span>
    </div>
  </div>
  <div class="card">
    <h2>주 공진 주파수<small>띠 = 학습 녹음별 평균의 범위</small></h2>
    <svg id="bar" viewBox="0 0 600 150" preserveAspectRatio="xMidYMid meet" style="flex:0 0 auto;height:15vh"></svg>
    <ul id="hist"></ul>
  </div>
</section>

<footer>
  <span>판정은 시연 노트북에서 계산되어 실시간으로 전송됩니다 · 검사 1회 = 유효 타격 <span id="nv">3</span>회 다수결</span>
  <span id="sess"></span>
</footer>

<script>
/* ---------- 설정 (주소 뒤에 ?s=세션이름 으로 바꿀 수 있음) ---------- */
const P = new URLSearchParams(location.search);
const SUPABASE_URL = P.get("url") || "https://xuwzdqvusjgwrxflztrv.supabase.co";
const ANON_KEY = P.get("key") || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1d3pkcXZ1c2pnd3J4Zmx6dHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMDczOTEsImV4cCI6MjExMDU4MzM5MX0.ZHwTN6z17DK2TaUMcJ25hUyvBwYvGa1IEWhKMR7gohc";
const SESSION = P.get("s") || "knock";
const POLL_MS = 400;

const H = { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY };
const $ = id => document.getElementById(id);
const BLUE = "#1f5fa8", RED = "#c0392b", GRAY = "#8a8f98";
$("sess").textContent = "세션: " + SESSION;

let cfg = null;          // start 이벤트 내용 (기준 스펙트럼, 범위, 다수결 수)
let round = [];          // 이번 판정의 유효 타격
let finalDone = false;
let lastId = 0;
let lastStatusStamp = null, lastStatusSeen = 0;
let fetchOk = true;

/* ---------- 그리기 ---------- */
const PL = 58, PR = 30;   /* 스펙트럼 그림 좌우 여백 */
function specPath(arr, grid, w, h) {
  if (!arr) return "";
  const [f0, f1, n] = grid;
  return arr.map((v, i) => {
    const x = PL + (i / (n - 1)) * (w - PL - PR);
    const y = Math.min(h, Math.max(0, (-v / 40) * h));
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
}
function drawSpec(cur) {
  const W = 800, Hh = 340, svg = $("spec");
  const grid = cfg ? cfg.grid : [3400, 4600, 241];
  let s = "";
  for (let db = 0; db <= 40; db += 10) {
    const y = db / 40 * Hh;
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="#eceef2"/>`;
    s += `<text x="${PL - 6}" y="${y + 5}" font-size="14" fill="#999" text-anchor="end">${-db}</text>`;
  }
  for (let f = 3400; f <= 4600; f += 200) {
    const x = PL + (f - grid[0]) / (grid[1] - grid[0]) * (W - PL - PR);
    s += `<line x1="${x}" x2="${x}" y1="0" y2="${Hh}" stroke="#eceef2"/>`;
    s += `<text x="${x}" y="${Hh + 26}" font-size="15" fill="#666" text-anchor="middle">${f.toLocaleString()}</text>`;
  }
  if (cfg && cfg.ref) {
    if (cfg.ref["정상"]) s += `<path d="${specPath(cfg.ref["정상"], grid, W, Hh)}" fill="none" stroke="${BLUE}" stroke-width="2.5" stroke-dasharray="8 6"/>`;
    if (cfg.ref["열화"]) s += `<path d="${specPath(cfg.ref["열화"], grid, W, Hh)}" fill="none" stroke="${RED}" stroke-width="2.5" stroke-dasharray="8 6"/>`;
  }
  if (cur) s += `<path d="${specPath(cur, grid, W, Hh)}" fill="none" stroke="#111" stroke-width="3.5"/>`;
  svg.innerHTML = s;
}
function drawBar() {
  const W = 600, svg = $("bar");
  if (!cfg || !cfg.ranges) { svg.innerHTML = ""; return; }
  const r = cfg.ranges.f_main, n = r["정상"], d = r["열화"];
  const lo = n[0], hi = d[1], pad = 0.4 * (hi - lo), x0 = lo - pad, x1 = hi + pad;
  const X = f => (f - x0) / (x1 - x0) * W;
  let s = `<rect x="${X(n[0])}" y="20" width="${Math.max(3, X(n[1]) - X(n[0]))}" height="80" fill="${BLUE}" opacity="0.22"/>`;
  s += `<rect x="${X(d[0])}" y="20" width="${Math.max(3, X(d[1]) - X(d[0]))}" height="80" fill="${RED}" opacity="0.22"/>`;
  s += `<text x="${X((n[0]+n[1])/2)}" y="16" font-size="15" fill="${BLUE}" text-anchor="middle">정상</text>`;
  s += `<text x="${X((d[0]+d[1])/2)}" y="16" font-size="15" fill="${RED}" text-anchor="middle">열화</text>`;
  const step = (x1 - x0) > 600 ? 200 : 100;
  for (let f = Math.ceil(x0 / step) * step; f <= x1; f += step)
    s += `<text x="${X(f)}" y="130" font-size="15" fill="#666" text-anchor="middle">${f.toLocaleString()}</text>`;
  s += `<line x1="0" x2="${W}" y1="100" y2="100" stroke="#bbb"/>`;
  round.forEach(h => {
    const x = Math.max(2, Math.min(W - 2, X(h.f_main)));
    const c = finalDone ? (h.pred ? RED : BLUE) : GRAY;
    s += `<line x1="${x}" x2="${x}" y1="22" y2="100" stroke="${c}" stroke-width="5"/>`;
  });
  svg.innerHTML = s;
}
function drawDots() {
  const N = cfg ? cfg.votes : 3;
  let s = "";
  for (let i = 0; i < N; i++) {
    const h = round[i];
    s += `<div class="dot ${h ? (finalDone ? (h.pred ? "d" : "n") : "g") : ""}"></div>`;
  }
  $("dots").innerHTML = s;
}
function drawHist(extra) {
  const li = round.map((h, i) => finalDone
    ? `<li>${i + 1}회: <b class="${h.pred ? "d" : "n"}">${h.label}</b> · ${Math.round(h.f_main).toLocaleString()} Hz</li>`
    : `<li>${i + 1}회: 완료 · ${Math.round(h.f_main).toLocaleString()} Hz</li>`);
  if (extra) li.push(`<li class="x">${extra}</li>`);
  $("hist").innerHTML = li.slice(-6).join("");
}
function setBig(text, color, sub) {
  $("big").textContent = text; $("big").style.color = color; $("sub").textContent = sub || "";
}
function clearRound() { round = []; finalDone = false; drawBar(); drawDots(); drawHist(); }

/* ---------- 이벤트 처리 (노트북 판정 창과 같은 상태를 따라감) ---------- */
const AMBER = "#b7791f", INK = "#333";
let testing = false;
function votesN() { return cfg ? cfg.votes : 3; }
function handle(ev) {
  const p = ev.payload || {};
  if (ev.kind === "start") {
    cfg = p; clearRound(); drawSpec(null); $("nv").textContent = p.votes || 3; testing = false;
    setBig("대기 중", GRAY, "검사 시작을 기다리는 중입니다");
  } else if (ev.kind === "test_start") {
    if (cfg && p.votes) cfg.votes = p.votes;
    clearRound(); drawSpec(null); testing = true;
    setBig(`검사 중 (0/${votesN()})`, INK, "텀블러를 쳐 주세요");
  } else if (ev.kind === "invalid") {
    if (p.spec) drawSpec(p.spec);
    setBig(`검사 중 (${round.length}/${votesN()})`, INK, "다시 쳐 주세요: " + (p.reason || ""));
    drawHist("(무효: " + (p.reason || "") + ")");
  } else if (ev.kind === "hit") {
    round.push(p);
    if (p.spec) drawSpec(p.spec);
    setBig(`검사 중 (${round.length}/${votesN()})`, INK,
           `${round.length}회째 타격 완료 · 주 공진 주파수 ${Math.round(p.f_main).toLocaleString()} Hz`);
    drawBar(); drawDots(); drawHist();
  } else if (ev.kind === "test_end") {
    testing = false;
    setBig("판정 중...", INK, `유효 타격 ${round.length}회 분석 중`);
  } else if (ev.kind === "final") {
    finalDone = true; testing = false;
    if (p.final === null || p.final === undefined) {
      setBig("판정 보류", AMBER, `${p.n}회 중 ${p.k}회 열화로 결과가 엇갈림 · 다시 검사합니다`);
    } else {
      setBig(p.final ? "열화 (진공 손상)" : "정상 (진공 유지)", p.final ? RED : BLUE,
             `판정 완료: ${p.n}회 중 ${p.k}회 열화 · 평균 ${Math.round(p.f_mean).toLocaleString()} Hz`);
    }
    drawBar(); drawDots(); drawHist();
  } else if (ev.kind === "cancel") {
    clearRound(); testing = false;
    setBig("검사 취소", GRAY, "유효 타격이 없어 판정하지 않았습니다");
  } else if (ev.kind === "reset") {
    clearRound(); drawSpec(null); setBig("대기 중", GRAY, "검사 시작을 기다리는 중입니다");
  }
}

/* ---------- 서버에서 가져오기 ---------- */
async function get(path) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: H, cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function init() {
  try {
    const st = await get(`demo_events?select=id&session=eq.${encodeURIComponent(SESSION)}&kind=eq.start&order=id.desc&limit=1`);
    lastId = st.length ? st[0].id - 1 : 0;
  } catch (e) { fetchOk = false; }
  drawSpec(null); drawDots();
  poll(); status();
}
async function poll() {
  try {
    const evs = await get(`demo_events?select=id,kind,payload&session=eq.${encodeURIComponent(SESSION)}&id=gt.${lastId}&order=id.asc&limit=50`);
    evs.forEach(ev => { handle(ev); lastId = ev.id; });
    fetchOk = true;
  } catch (e) { fetchOk = false; }
  setTimeout(poll, POLL_MS);
}
async function status() {
  try {
    const st = await get(`demo_status?select=updated_at,payload&session=eq.${encodeURIComponent(SESSION)}`);
    if (st.length && st[0].updated_at !== lastStatusStamp) { lastStatusStamp = st[0].updated_at; lastStatusSeen = Date.now(); }
    fetchOk = true;
  } catch (e) { fetchOk = false; }
  const c = $("conn");
  if (!fetchOk) { c.textContent = "인터넷 연결 안 됨"; c.className = "badge off"; }
  else if (Date.now() - lastStatusSeen < 8000) { c.textContent = "시연 노트북 연결됨"; c.className = "badge on"; }
  else { c.textContent = "시연 노트북 신호 없음"; c.className = "badge off"; }
  setTimeout(status, 2000);
}
init();
</script>
</body>
</html>
